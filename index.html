    <!-- Suppress harmless Vite HMR WebSocket errors in sandbox environment -->
    <script>
      (function() {
        window.addEventListener('error', function(event) {
          if (
            event.message &&
            (event.message.indexOf('WebSocket') !== -1 ||
             event.message.indexOf('vite') !== -1)
          ) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          if (
            reason &&
            ((reason.message && (reason.message.indexOf('WebSocket') !== -1 || reason.message.indexOf('vite') !== -1)) ||
             (typeof reason === 'string' && (reason.indexOf('WebSocket') !== -1 || reason.indexOf('vite') !== -1)))
          ) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);
      })();
    </script>
