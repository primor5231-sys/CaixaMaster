<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#002d57"/>
      <stop offset="100%" stop-color="#004481"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA41C"/>
      <stop offset="100%" stop-color="#F39200"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A3E0"/>
      <stop offset="100%" stop-color="#0066B2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#00A3E0" stroke-opacity="0.3" stroke-width="4"/>
  
  <!-- Stylized CEF 'X' ribbon emblem -->
  <g transform="translate(256,236)">
    <!-- Cyan bar angled left -->
    <path d="M-130,-100 L-40,-100 L110,120 L20,120 Z" fill="url(#blueGrad)" filter="url(#glow)"/>
    <!-- Orange bar angled right intersecting -->
    <path d="M40,-100 L130,-100 L-20,120 L-110,120 Z" fill="url(#orangeGrad)" filter="url(#glow)"/>
    <!-- Center star / diamond highlight -->
    <polygon points="0,-15 15,0 0,15 -15,0" fill="#FFFFFF" opacity="0.9"/>
  </g>
  
  <!-- Text: CAIXAMASTER -->
  <text x="256" y="420" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">CAIXAMASTER</text>
  <text x="256" y="455" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="20" fill="#FFA41C" text-anchor="middle" letter-spacing="3">CONCURSOS CEF</text>
</svg>
